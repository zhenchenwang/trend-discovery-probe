name: TikTok eco browser probe

on:
  push:
    paths:
      - "tests/live/tiktok_eco_probe.py"
      - ".github/workflows/tiktok_eco_probe.yml"
  workflow_dispatch:

jobs:
  eco:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PROBE_TAG: 机器人
      PROBE_OUT: tiktok_eco_artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Playwright only
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install chromium
      - name: Run no-media discovery probe
        run: python tests/live/tiktok_eco_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-eco-${{ github.run_id }}
          path: tiktok_eco_artifacts/tiktok_eco_probe.json
          retention-days: 3
