name: TikTok comments probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/live/tiktok_comments_probe.py'
      - '.github/workflows/comments_probe.yml'

jobs:
  comments:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Playwright
        run: |
          python -m pip install --disable-pip-version-check playwright
          python -m playwright install --with-deps chromium
      - name: Run live comment probe
        run: python tests/live/tiktok_comments_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: comments-probe-${{ github.run_id }}
          path: comment_probe_artifacts/comments_probe.json
          retention-days: 7
