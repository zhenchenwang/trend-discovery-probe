name: TikTok event clustering probe

on:
  workflow_dispatch:
    inputs:
      tag:
        description: TikTok hashtag without #
        required: false
        default: 机器人
  push:
    paths:
      - 'tests/live/tiktok_event_cluster_probe.py'
      - '.github/workflows/event_cluster_probe.yml'

permissions:
  contents: read

jobs:
  events:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PROBE_TAG: ${{ github.event.inputs.tag || '机器人' }}
      PROBE_HASHTAG_LIMIT: '120'
      PROBE_ACCOUNT_LIMIT: '60'
      PROBE_ACCOUNT_COUNT: '3'
      PROBE_EVENT_THRESHOLD: '0.36'
      PROBE_OUT: event_cluster_artifacts
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run event clustering probe
        run: python tests/live/tiktok_event_cluster_probe.py
      - name: Print summary
        if: always()
        run: cat event_cluster_artifacts/event_cluster_summary.json 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-event-cluster-${{ github.run_id }}
          path: event_cluster_artifacts/
          retention-days: 7
