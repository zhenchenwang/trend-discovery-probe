name: TikTok account discovery probe

on:
  workflow_dispatch:
    inputs:
      account:
        description: TikTok account without @
        required: false
        default: gdgdryyds
      limit:
        description: Candidate limit
        required: false
        default: '100'
  push:
    paths:
      - 'tests/live/tiktok_account_probe.py'
      - '.github/workflows/account_probe.yml'

permissions:
  contents: read

jobs:
  account:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PROBE_ACCOUNT: ${{ github.event.inputs.account || 'gdgdryyds' }}
      PROBE_LIMIT: ${{ github.event.inputs.limit || '100' }}
      PROBE_OUT: account_artifacts
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Run account probe
        run: python tests/live/tiktok_account_probe.py
      - name: Print summary
        if: always()
        run: cat account_artifacts/account_probe.json 2>/dev/null || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-account-${{ github.run_id }}
          path: account_artifacts/
          retention-days: 7
