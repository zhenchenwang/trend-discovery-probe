name: YouTube finalist download probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/live/youtube_download_probe.py'
      - '.github/workflows/youtube_download_probe.yml'

jobs:
  download:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      PROBE_VIDEO_ID: gqRO8PuPVd0
      PROBE_OUT: youtube_download_artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install yt-dlp only
        run: python -m pip install --disable-pip-version-check yt-dlp
      - name: Download one finalist Short
        run: python tests/live/youtube_download_probe.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youtube-download-${{ github.run_id }}
          path: |
            youtube_download_artifacts/youtube_download_probe.json
            youtube_download_artifacts/*.mp4
          retention-days: 3
