name: Real TikTok to Mix E2E

on:
  workflow_dispatch:
    inputs:
      tag:
        description: TikTok hashtag without #
        required: false
        default: 机器人
      limit:
        description: Candidate discovery limit
        required: false
        default: '55'
  push:
    paths:
      - 'tests/live/real_mix_e2e_probe.py'
      - 'tests/live/real_mix_e2e_probe_v2.py'
      - 'tests/live/tiktok_e2e_probe_v2.py'
      - 'tests/live/youtube_comments_probe.py'
      - '.github/workflows/real_mix_e2e_probe.yml'

permissions:
  contents: read

jobs:
  real-mix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PROBE_TAG: ${{ github.event.inputs.tag || '机器人' }}
      PROBE_LIMIT: ${{ github.event.inputs.limit || '55' }}
      PROBE_ROOT: artifacts/real_mix_crosssource
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install media and browser dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install 'playwright>=1.50' 'edge-tts>=7.2,<8'
          python -m playwright install --with-deps chromium
      - name: Run real cross-source Mix E2E
        run: python tests/live/real_mix_e2e_probe_v2.py
      - name: Print summary
        if: always()
        run: cat artifacts/real_mix_crosssource/summary.json 2>/dev/null || true
      - name: Upload real Mix evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: real-mix-e2e-${{ github.run_id }}
          path: |
            artifacts/real_mix_crosssource/summary.json
            artifacts/real_mix_crosssource/real_mix.mp4
            artifacts/real_mix_crosssource/comment.mp3
          retention-days: 7
